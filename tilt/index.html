const CATEGORIES = ['All','Reflex','Memory','Perception','Timing','Focus','Reasoning'];
const byId = id => GAMES.find(g => g.id === id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const round = x=>Math.round(x);
const gaussian = (error,sigma) => round(100*Math.exp(-.5*(error/sigma)**2));
const rng = seed => { let t=seed>>>0;return () => { t += 0x6D2B79F5;let z=Math.imul(t^(t>>>15),1|t);z^=z+Math.imul(z^(z>>>7),61|z);return ((z^(z>>>14))>>>0)/4294967296; }; };
const hash = value => {let h=2166136261; for(const c of value) h=Math.imul(h^c.charCodeAt(0),16777619); return h>>>0;};
const choice=(arr,r=Math.random)=>arr[Math.floor(r()*arr.length)];
const shuffle=(arr,r=Math.random)=>{let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = ()=>new Date().toLocaleDateString('en-CA');
const dailyIds = (date=today())=>shuffle(GAMES.map(x=>x.id),rng(hash('tilt-v1-'+date))).slice(0,5);


const $=(sel,root=document)=>root.querySelector(sel);
const el=(tag,cls='',text='')=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const h=(stage,markup)=>{stage.innerHTML=markup;return stage};
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const wait=ms=>new Promise(res=>setTimeout(res,ms));
class Session {
 constructor(stage,finish){this.stage=stage;this.finish=finish;this.dead=false;this.timers=new Set();this.cleanups=[];}
 after(fn,ms){const id=setTimeout(()=>{this.timers.delete(id);if(!this.dead)fn()},ms);this.timers.add(id);return id;}
 every(fn,ms){const id=setInterval(()=>{if(!this.dead)fn()},ms);this.cleanups.push(()=>clearInterval(id));return id;}
 on(target,event,fn,options){target.addEventListener(event,fn,options);this.cleanups.push(()=>target.removeEventListener(event,fn,options));}
 stop(){this.dead=true;for(const t of this.timers)clearTimeout(t);this.timers.clear();this.cleanups.forEach(fn=>fn());this.cleanups=[];}
 done(score,raw,detail){if(this.dead)return;this.stop();this.finish(clamp(Math.round(score),0,100),raw,detail);}
}
const stageStats=(step,total,note='')=>`<div class="game-meta"><span>${step} <span class="dim">/ ${total}</span></span><span>${note}</span></div>`;
const footer=(label='Make your guess')=>`<p class="board-footnote">${label}</p>`;
const action=(name='Lock it in')=>`<button class="solid-action" id="commit" type="button">${name} <span>↗</span></button>`;
const precision=(error,sigma)=>gaussian(error,sigma);
const niceMs=ms=>`${Math.round(ms)} ms`;
const feedback=(s,copy,fn)=>{const tag=el('div','round-feedback');tag.innerHTML=`<span class="round-feedback-score">${s} / 100</span><span>${copy}</span>`;s.stage.append(tag);s.after(fn,850)};

function reaction(s){let tries=[],falseStarts=0,phase='idle',goAt=0;
 function paint(){h(s.stage,`${stageStats(tries.length,5,`False starts ${falseStarts}`)}<div class="react-panel ${phase==='go'?'go':phase==='waiting'?'waiting':''}" id="react"><div class="react-glyph">${phase==='go'?'↯':phase==='waiting'?'· · ·':'↗'}</div><h2>${phase==='go'?'NOW!':phase==='waiting'?'Wait for green':'Click to begin'}</h2><p>${phase==='go'?'GO GO GO':phase==='waiting'?'Do not click yet':tries.length?`Last: ${niceMs(tries.at(-1))}`:'Five attempts. Be quick, not early.'}</p></div><div class="game-subtext">${tries.length?`Your attempts: ${tries.map(niceMs).join(' · ')}`:'Hardware and screen latency affect results.'}</div>`);$('#react',s.stage).onclick=click;}
 function click(){if(phase==='idle'){phase='waiting';paint();s.after(()=>{if(phase!=='waiting')return;phase='go';goAt=performance.now();paint()},irnd(1300,3100));}
 else if(phase==='waiting'){falseStarts++;phase='idle';paint();if(falseStarts>=3)s.done(0,'3 false starts','Too many early clicks. Try again.');}
 else if(phase==='go'){tries.push(performance.now()-goAt);phase='idle';if(tries.length===5){const avg=tries.reduce((a,b)=>a+b,0)/5;s.done(clamp(100-(avg-180)*.18,0,100),`${Math.round(avg)} ms average`,`${tries.map(niceMs).join(' · ')}. ${falseStarts} false start(s). Score is a personal game index, not a population percentile.`)}else paint();}}
 paint();}

function aim(s){let hits=0,misses=0,started=performance.now(),last=0,positions=[];h(s.stage,`${stageStats(0,20,'Speed + accuracy')}<div class="aim-field" id="field"><div class="aim-target" id="target" role="button" aria-label="Hit target"><i></i></div><div class="aim-hint">CLICK THE TARGET</div></div><div class="game-subtext">A miss adds 250 milliseconds to your total.</div>`);const field=$('#field',s.stage),target=$('#target',s.stage),meta=$('.game-meta',s.stage);
 function next(){const w=field.clientWidth,h=field.clientHeight;const x=rnd(35,Math.max(36,w-35)),y=rnd(35,Math.max(36,h-35));target.style.left=x+'px';target.style.top=y+'px';positions.push([x,y]);meta.firstElementChild.innerHTML=`${hits} <span class="dim">/ 20</span>`;}
 field.addEventListener('click',e=>{if(s.dead)return;if(e.target.closest('#target'))return;misses++});
 target.addEventListener('click',e=>{e.stopPropagation();hits++;last=performance.now();if(hits>=20){const avg=(last-started+misses*250)/20;s.done(clamp(104-(avg-220)*.12,0,100),`${Math.round(avg)} ms/target`,`${misses} missed clicks. 20 targets hit.`);}else next()});next();}

function sequence(s){let level=2,seq=[],index=0,mistakes=0,showing=false,rounds=0;const tones=[261.63,329.63,392,523.25];let audio;
 function tone(i){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=tones[i];g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.21);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.22)}catch{}}
 function build(){h(s.stage,`${stageStats(Math.max(1,level-1),12,`Mistakes ${mistakes} / 2`)}<div class="sequence-caption" id="caption">Watch the sequence</div><div class="sequence-grid">${Array.from({length:4},(_,i)=>`<button class="sequence-tile tile-${i}" data-i="${i}" aria-label="Tile ${i+1}"></button>`).join('')}</div><div class="game-subtext">Each correct round adds a new step.</div>`);s.stage.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>press(+b.dataset.i));}
 function light(i){const b=s.stage.querySelector(`[data-i="${i}"]`);if(!b)return;b.classList.add('lit');tone(i);s.after(()=>b.classList.remove('lit'),365)}
 function play(){showing=true;index=0;seq.push(irnd(0,3));$('#caption',s.stage).textContent=`Remember ${seq.length} steps`;seq.forEach((v,k)=>s.after(()=>light(v),480+k*580));s.after(()=>{showing=false;$('#caption',s.stage).textContent='Your turn · repeat the lights'},480+seq.length*580);}
 function press(i){if(showing)return;light(i);if(i!==seq[index]){mistakes++;if(mistakes>=2){s.done(clamp(level*9,0,100),`Level ${level-1}`,`Reached ${seq.length} steps with ${mistakes} errors.`);return}$('#caption',s.stage).textContent='Not quite. Watch again';s.after(()=>{build();seq.pop();play()},900);return}index++;if(index===seq.length){rounds++;level++;if(level>12){s.done(100,'Level 12','Perfect twelve-level sequence.');return}$('#caption',s.stage).textContent='Perfect. Level up!';s.after(()=>{build();play()},850)}}
 build();s.after(play,700);return()=>audio?.close();}

function grid(s){let roundNo=0,sum=0,selected=new Set(),correct=new Set(),phase='start';let size=4;
 function draw(){size=roundNo>1?5:4;const needed=3+roundNo*2;const cells=shuffle(Array.from({length:size*size},(_,i)=>i)).slice(0,needed);correct=new Set(cells);selected=new Set();phase='flash';h(s.stage,`${stageStats(roundNo+1,4,`${needed} lit squares`)}<div class="grid-caption" id="caption">Memorize these squares</div><div class="recall-grid" style="--cols:${size}">${Array.from({length:size*size},(_,i)=>`<button class="recall-cell ${correct.has(i)?'on':''}" data-i="${i}" aria-label="Square ${i+1}"></button>`).join('')}</div><div class="grid-controls" id="controls"><span>Look carefully.</span></div>`);s.after(()=>{phase='input';s.stage.querySelectorAll('.recall-cell').forEach(b=>{b.classList.remove('on');b.onclick=()=>{const n=+b.dataset.i;if(selected.has(n)){selected.delete(n);b.classList.remove('picked')}else{selected.add(n);b.classList.add('picked')}$('#controls',s.stage).innerHTML=`<span>${selected.size} / ${needed} selected</span> ${action('Check memory')}`;$('#commit',s.stage).onclick=check}});$('#caption',s.stage).textContent='Select the squares you remember';$('#controls',s.stage).innerHTML=`<span>0 / ${needed} selected</span> ${action('Check memory')}`;$('#commit',s.stage).onclick=check},1450)}
 function check(){if(phase!=='input')return;phase='reveal';let hits=[...selected].filter(i=>correct.has(i)).length,extras=selected.size-hits;sum+=Math.max(0,round((hits-extras*.6)/correct.size*100));s.stage.querySelectorAll('.recall-cell').forEach(b=>{b.onclick=null;if(correct.has(+b.dataset.i))b.classList.add('correct');else if(selected.has(+b.dataset.i))b.classList.add('wrong')});$('#caption',s.stage).textContent=`${hits} of ${correct.size} remembered`;$('#controls',s.stage).innerHTML=`<span>${extras} extra selection(s)</span>`;roundNo++;if(roundNo>=4)s.after(()=>s.done(sum/4,`${round(sum/4)} / 100`,`Across four memory grids; extra selections are penalized.`),1150);else s.after(draw,1300)}draw();}

function digits(s){let length=4,peak=3,number='';function roundStart(){number=Array.from({length},()=>irnd(0,9)).join('');h(s.stage,`${stageStats(length-3,12,'Digit span')}<div class="digits-label">HOLD THIS NUMBER IN YOUR MIND</div><div class="digits-number" id="digits">${number}</div><div class="game-subtext">${length} digits · disappearing shortly</div>`);s.after(()=>{h(s.stage,`${stageStats(length-3,12,'Digit span')}<div class="digits-label">WHAT WAS THE NUMBER?</div><form class="digits-form" id="digitform"><input id="digitinput" aria-label="Enter remembered digits" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Type the digits" autofocus>${action('Check')}</form><div class="game-subtext">The order must match exactly.</div>`);$('#digitform',s.stage).onsubmit=e=>{e.preventDefault();if($('#digitinput',s.stage).value.trim()===number){peak=length;length++;if(length>15)s.done(100,'15 digits','You reached the maximum level.');else{h(s.stage,`<div class="center-note"><div class="win-mark">✓</div><h2>Perfect recall</h2><p>Going up to ${length} digits.</p></div>`);s.after(roundStart,720)}}else{s.done(clamp(peak*8,0,100),`${peak} digits`,`Correct number: ${number}. Your answer: ${$('#digitinput',s.stage).value.trim()||'none'}.`)}};$('#digitinput',s.stage).focus()},Math.max(1600,2400-(length-4)*80))}roundStart()}

const VOCAB=`orchid velvet kettle canyon lantern compass ripple meadow planet marble whisper glacier pocket velvet comet velvet anchor library velvet satellite copper harbor meadow violet cardinal zipper mirror garden rocket pillow eclipse cinnamon lantern mountain parcel pencil meadow trolley window blanket nebula squirrel pebble candle thunder apricot telescope balcony river jungle horizon shoelace coral story sweater magnet oyster bicycle passport camera trumpet feather castle compass walnut coffee crystal pudding violin island airplane triangle blossom waterfall cosmos blossom pyramid whisper marshmallow toaster diamond ribbon velvet umbrella railway pumpkin charcoal balloon rocket umbrella feather planet ginger sunrise glacier meadow jacket orchid satellite horizon valley moonlight galaxy elevator lavender castle guitar violin orchard bubble flamingo papaya umbrella bicycle atlas lantern ceramic autumn hummingbird coral maple ribbon sandwich tundra lantern compass thunder shoelace meadow ripple citrus moss forest bridge sunset paper sunflower espresso comet lantern skyline seahorse sapphire mandarin meadow curtain ocean constellation hourglass kettle banana pocket spiral`.split(' ');
function words(s){let pool=shuffle([...new Set(VOCAB)]),shown=new Set(),history=[],correct=0,lives=3,turn=0,current='',known=false;
 function next(){if(turn>=32){finish();return}known=history.length>=3&&Math.random()<.43;current=known?choice(history):pool.shift()||`word${turn}`;h(s.stage,`${stageStats(turn+1,32,`${lives} lives left`)}<div class="word-eyebrow">HAVE YOU SEEN THIS BEFORE?</div><div class="word-stage">${current}</div><div class="binary-actions"><button class="choice-btn no" id="new">NEW <span>Never seen</span></button><button class="choice-btn yes" id="seen">SEEN <span>Appeared before</span></button></div><div class="game-subtext">Think back to this run only.</div>`);$('#new',s.stage).onclick=()=>answer(false);$('#seen',s.stage).onclick=()=>answer(true)}
 function answer(response){if(response===known)correct++;else lives--;if(!known){shown.add(current);history.push(current)}turn++;if(!lives)finish();else next()}
 function finish(){s.done(clamp(correct/32*100,0,100),`${correct} correct`,`You correctly classified ${correct} words in ${turn} rounds with ${3-lives} mistakes.`)}next();}

function chimp(s){let n=4,failures=0,expected=1,board=[],map=new Map(),hidden=false,round=0;
 function start(){hidden=false;expected=1;board=shuffle(Array.from({length:25},(_,i)=>i)).slice(0,n);map=new Map(board.map((v,i)=>[v,i+1]));h(s.stage,`${stageStats(n-3,8,`${failures} misses / 2`)}<div class="grid-caption" id="caption">Find 1, then remember the positions</div><div class="chimp-grid">${Array.from({length:25},(_,i)=>`<button class="chimp-cell ${map.has(i)?'filled':''}" data-i="${i}" aria-label="Cell ${i+1}">${map.get(i)||''}</button>`).join('')}</div><div class="game-subtext">Numbers hide once you press 1.</div>`);s.stage.querySelectorAll('.chimp-cell').forEach(b=>b.onclick=()=>click(b))}
 function click(b){const k=+b.dataset.i,num=map.get(k);if(!num)return;if(num!==expected){failures++;$('#caption',s.stage).textContent='Out of order';if(failures>=2){s.done(round*13,`Level ${n-1}`,`Reached ${n} numbers with two mistakes.`);return} s.after(start,500);return}if(expected===1){hidden=true;s.stage.querySelectorAll('.chimp-cell.filled').forEach(x=>x.textContent='')};b.classList.add('cleared');b.disabled=true;expected++;if(expected>n){round++;n++;if(n>10){s.done(100,'10 numbers','Amazing spatial memory.');return}$('#caption',s.stage).textContent='Cleared! Next level';s.after(start,850)}}start();}

function dots(s){let roundNo=0,sum=0,count=0;
 function draw(){count=irnd(17,73);const dots=[];let n=0;while(dots.length<count&&n++<5000){const x=rnd(7,93),y=rnd(8,92);if(dots.every(d=>(d.x-x)**2+(d.y-y)**2>22))dots.push({x,y})}
 count=dots.length;h(s.stage,`${stageStats(roundNo+1,5,'One-second glance')}<div class="dot-board">${dots.map((d,i)=>`<span class="dot" style="left:${d.x}%;top:${d.y}%;--sz:${irnd(5,8)}px"></span>`).join('')}</div><div class="game-subtext">Watch the whole field. You only get one look.</div>`);s.after(()=>{h(s.stage,`${stageStats(roundNo+1,5,'Estimation')}<div class="digits-label">HOW MANY DOTS DID YOU SEE?</div><form class="digits-form" id="dotform"><input id="dotnum" aria-label="Estimated dots" type="number" min="0" max="200" placeholder="Your estimate" required>${action('Submit estimate')}</form><div class="game-subtext">No need to be exact. A close estimate counts.</div>`);$('#dotform',s.stage).onsubmit=e=>{e.preventDefault();const v=Number($('#dotnum',s.stage).value);const score=precision(Math.abs(v-count)/Math.max(count,1),.23);sum+=score;h(s.stage,`<div class="center-note"><div class="mini-score">${score} <small>/ 100</small></div><h2>There were ${count} dots.</h2><p>You guessed ${v}. ${Math.abs(count-v)} ${Math.abs(count-v)===1?'dot':'dots'} off.</p></div>`);roundNo++;if(roundNo>=5)s.after(()=>s.done(sum/5,`${round(sum/5)} / 100`,'Average accuracy across five fields of dots.'),900);else s.after(draw,950)};$('#dotnum',s.stage).focus()},1050)}draw();}

function angle(s){let roundNo=0,sum=0,target=0,value=45;function draw(){target=irnd(14,345);value=45;h(s.stage,`${stageStats(roundNo+1,5,'Spatial intuition')}<div class="angle-instruction">Make an angle of <strong>${target}°</strong></div><div class="angle-dial" id="dial"><div class="angle-ring"></div><div class="angle-base"></div><div class="angle-arm" id="arm"></div><div class="angle-center"></div><span class="dial-zero">0°</span><span class="dial-top">90°</span></div><div class="angle-value" id="current">${value}°</div>${action('Lock angle')}<div class="game-subtext">Click or drag the dial. Angles increase counterclockwise.</div>`);let dial=$('#dial',s.stage);const update=(e)=>{const r=dial.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;value=(Math.atan2(cy-e.clientY,e.clientX-cx)*180/Math.PI+360)%360;$('#arm',s.stage).style.transform=`rotate(${-value}deg)`;$('#current',s.stage).textContent=`${round(value)}°`};let dragging=false;dial.onpointerdown=e=>{dragging=true;dial.setPointerCapture(e.pointerId);update(e)};dial.onpointermove=e=>{if(dragging)update(e)};dial.onpointerup=e=>{dragging=false};$('#arm',s.stage).style.transform=`rotate(-${value}deg)`;$('#commit',s.stage).onclick=()=>{const error=Math.abs((value-target+540)%360-180),score=precision(error,23);sum+=score;h(s.stage,`<div class="center-note"><div class="mini-score">${score} <small>/ 100</small></div><h2>${target}° was the target.</h2><p>Your dial: ${round(value)}°. Error: ${round(error)}°.</p></div>`);roundNo++;if(roundNo===5)s.after(()=>s.done(sum/5,`${round(sum/5)} / 100`,'Five angles, with the shortest circular error used.'),850);else s.after(draw,850)}}draw();}

function split(s){let roundNo=0,sum=0,target=0,value=.5;
 function draw(){target=irnd(9,91)/100;value=.5;h(s.stage,`${stageStats(roundNo+1,5,'Proportion intuition')}<div class="split-instruction">Mark <strong>${round(target*100)}%</strong> of the line</div><div class="split-ruler" id="ruler"><div class="split-fill" id="fill" style="width:50%"></div><div class="split-handle" id="handle" style="left:50%"></div></div><div class="split-endpoints"><span>0%</span><span>100%</span></div><div class="split-estimate" id="estimate">Drag the marker to your answer</div>${action('Lock position')}<div class="game-subtext">The left endpoint is zero.</div>`);let ruler=$('#ruler',s.stage);const update=e=>{const r=ruler.getBoundingClientRect();value=clamp((e.clientX-r.left)/r.width,0,1);$('#fill',s.stage).style.width=(value*100)+'%';$('#handle',s.stage).style.left=(value*100)+'%'};let drag=false;ruler.onpointerdown=e=>{drag=true;ruler.setPointerCapture(e.pointerId);update(e)};ruler.onpointermove=e=>{if(drag)update(e)};ruler.onpointerup=()=>drag=false;$('#commit',s.stage).onclick=()=>{const error=Math.abs(target-value)*100,score=precision(error,9);sum+=score;h(s.stage,`<div class="center-note"><div class="mini-score">${score} <small>/ 100</small></div><h2>${round(target*100)}% was the mark.</h2><p>You placed ${value*100|0}%. Error: ${error.toFixed(1)} percentage points.</p></div>`);roundNo++;if(roundNo===5)s.after(()=>s.done(sum/5,`${round(sum/5)} / 100`,'Mean of five fraction estimates.'),900);else s.after(draw,900)}}draw();}

function color(s){let roundNo=0,correct=0,hue=0,sat=0,light=0,target='',options=[];
 function draw(){hue=irnd(0,359);sat=irnd(54,85);light=irnd(36,70);target=`hsl(${hue} ${sat}% ${light}%)`;let variants=shuffle([[0,0,0],[irnd(-16,-6),0,0],[irnd(6,16),0,0],[0,irnd(-17,-7),0],[0,0,irnd(-12,-5)],[0,0,irnd(5,12)]]);options=variants.map(([a,b,c])=>`hsl(${(hue+a+360)%360} ${clamp(sat+b,15,95)}% ${clamp(light+c,15,85)}%)`);h(s.stage,`${stageStats(roundNo+1,6,'Color memory')}<div class="color-prompt">Remember this exact shade</div><div class="color-memory" style="background:${target}"></div><div class="game-subtext">This color will disappear.</div>`);s.after(()=>{h(s.stage,`${stageStats(roundNo+1,6,'Pick the exact shade')}<div class="color-prompt">Which one did you just see?</div><div class="color-choices">${options.map((o,i)=>`<button class="color-choice" data-i="${i}" aria-label="Color choice ${i+1}" style="background:${o}"></button>`).join('')}</div><div class="game-subtext">Trust your color memory, not just your favorite.</div>`);s.stage.querySelectorAll('.color-choice').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=options[i]===target;correct+=ok?1:0;s.stage.querySelectorAll('.color-choice').forEach((n,j)=>{if(options[j]===target)n.classList.add('answer');if(j===i&&!ok)n.classList.add('incorrect');n.disabled=true});s.after(()=>{roundNo++;if(roundNo>=6)s.done(correct/6*100,`${correct} / 6`,`Identified ${correct} shades exactly.`);else draw()},900)})},1400)}draw();}

function polygonPoints(){let n=irnd(5,8);let pts=Array.from({length:n},(_,i)=>{const theta=-Math.PI/2+i*2*Math.PI/n;let r=rnd(75,115);return{x:180+Math.cos(theta)*r,y:162+Math.sin(theta)*r}});let A=0,Cx=0,Cy=0;for(let i=0;i<n;i++){let a=pts[i],b=pts[(i+1)%n],c=a.x*b.y-b.x*a.y;A+=c;Cx+=(a.x+b.x)*c;Cy+=(a.y+b.y)*c}if(Math.abs(A)<.001)return {pts,center:{x:180,y:162}};return{pts,center:{x:Cx/(3*A),y:Cy/(3*A)}}}
function balance(s){let roundNo=0,sum=0,shape;
 function draw(){shape=polygonPoints();const points=shape.pts.map(p=>`${p.x},${p.y}`).join(' ');h(s.stage,`${stageStats(roundNo+1,5,'Find the centroid')}<div class="balance-instruction">Where would this shape balance?</div><div class="geo-frame" id="geo"><svg viewBox="0 0 360 325" preserveAspectRatio="xMidYMid meet"><defs><pattern id="gridlines" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" stroke="currentColor" stroke-opacity=".07" fill="none"/></pattern></defs><rect width="360" height="325" fill="url(#gridlines)"/><polygon points="${points}" fill="#c4b1ff" stroke="#7450ff" stroke-width="2"/></svg><div class="geo-dot" id="geo-dot" hidden></div></div><div class="game-subtext">Tap anywhere inside or near the shape to drop your pin.</div>`);$('#geo',s.stage).onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*360,y=(e.clientY-r.top)/r.height*325;const error=Math.hypot(x-shape.center.x,y-shape.center.y),score=precision(error,37);sum+=score;const pin=$('#geo-dot',s.stage);pin.hidden=false;pin.style.left=(x/360*100)+'%';pin.style.top=(y/325*100)+'%';const trueDot=el('div','geo-dot true');trueDot.style.left=(shape.center.x/360*100)+'%';trueDot.style.top=(shape.center.y/325*100)+'%';e.currentTarget.append(trueDot);e.currentTarget.onclick=null;roundNo++;s.after(()=>{if(roundNo===5)s.done(sum/5,`${round(sum/5)} / 100`,'Five irregular polygon centroid guesses.');else draw()},1050)}}draw()}

function track(s){let roundNo=0,sum=0,p={};const W=620,H=310,G=520,GROUND=266;
 function make(){const x0=rnd(45,140),y0=rnd(95,150),vx=rnd(235,365),vy=-rnd(125,260),g=520;const disc=vy*vy+2*g*(GROUND-y0),t=(-vy+Math.sqrt(disc))/g;const land=x0+vx*t;p={x0,y0,vx,vy,g,land,started:performance.now()};h(s.stage,`${stageStats(roundNo+1,5,'Motion prediction')}<div class="track-instruction" id="track-title">Watch the flight...</div><div class="trajectory-field" id="flight"><div class="trajectory-ground"></div><div class="trajectory-ball" id="ball"></div><div class="trajectory-guide">PREDICT THE LANDING</div></div><div class="game-subtext">After the ball vanishes, click on the ground line.</div>`);const ball=$('#ball',s.stage),field=$('#flight',s.stage);const duration=540;
 function animate(){if(s.dead||!ball.isConnected)return;let t=Math.min((performance.now()-p.started)/1000,duration/1000);let x=p.x0+p.vx*t,y=p.y0+p.vy*t+.5*p.g*t*t;ball.style.left=(x/W*100)+'%';ball.style.top=(y/H*100)+'%';if(t<duration/1000)requestAnimationFrame(animate);else{ball.style.display='none';$('#track-title',s.stage).textContent='Where will it land?';field.classList.add('predicting');field.onclick=e=>{const r=field.getBoundingClientRect(),guess=clamp((e.clientX-r.left)/r.width*W,0,W),error=Math.abs(guess-p.land),score=precision(error,75);sum+=score;field.onclick=null;field.classList.remove('predicting');const good=el('span','track-marker correct');good.style.left=(clamp(p.land,0,W)/W*100)+'%';const mine=el('span','track-marker mine');mine.style.left=(guess/W*100)+'%';field.append(good,mine);$('#track-title',s.stage).textContent=`${round(error)} units from landing`;roundNo++;s.after(()=>{if(roundNo>=5)s.done(sum/5,`${round(sum/5)} / 100`,'Mean of five predicted landing positions.');else make()},1150)}}}requestAnimationFrame(animate)}make()}

function clock(s){let roundNo=0,sum=0,target=0,down=0;
 function draw(){target=irnd(22,51)/10;h(s.stage,`${stageStats(roundNo+1,5,'No countdown allowed')}<div class="clock-instruction">Hold for <strong>${target.toFixed(1)} seconds</strong></div><button class="hold-button" id="hold" type="button"><span class="hold-icon">◷</span><span id="hold-label">PRESS AND HOLD</span></button><div class="game-subtext">Release when you think your time is up.</div>`);const btn=$('#hold',s.stage);const start=e=>{if(down)return;down=performance.now();btn.classList.add('holding');$('#hold-label',s.stage).textContent='LET GO WHEN READY';btn.setPointerCapture?.(e.pointerId)};const end=()=>{if(!down)return;const secs=(performance.now()-down)/1000;down=0;btn.classList.remove('holding');btn.onpointerdown=null;btn.onpointerup=null;const error=Math.abs(secs-target),score=precision(error,0.9);sum+=score;h(s.stage,`<div class="center-note"><div class="mini-score">${score} <small>/ 100</small></div><h2>You held ${secs.toFixed(2)}s.</h2><p>Target ${target.toFixed(1)}s · ${error.toFixed(2)}s off.</p></div>`);roundNo++;s.after(()=>{if(roundNo>=5)s.done(sum/5,`${round(sum/5)} / 100`,'Average timing accuracy across five intervals.');else draw()},900)};btn.onpointerdown=start;btn.onpointerup=end;btn.onpointercancel=end}
 draw()}

function beat(s){let tempo=irnd(67,115),period=60000/tempo,pulse=0,taps=[],start=0,ready=false,audio;
 function tick(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch{}}
 h(s.stage,`${stageStats(0,5,'Rhythm')}<div class="beat-instruction" id="beatinstruction">Watch the four-beat preview</div><button class="beat-disc" id="disc"><span>♪</span></button><div class="beat-counter" id="beatcounter">● ○ ○ ○</div><div class="game-subtext">Click Start; then tap the disc or Space five times.</div><button class="solid-action" id="beginbeat">Start rhythm <span>↗</span></button>`);
 const disc=$('#disc',s.stage);const update=(text)=>$('#beatinstruction',s.stage).textContent=text;const press=(e)=>{if(!ready||s.dead)return;e?.preventDefault?.();const t=performance.now();taps.push(t);disc.classList.add('pulsing');s.after(()=>disc.classList.remove('pulsing'),125);$('#beatcounter',s.stage).textContent=`${taps.length} / 5 taps`;if(taps.length>=5){ready=false;const err=taps.map((t,i)=>Math.abs(t-(start+i*period)));const mean=err.reduce((a,b)=>a+b,0)/5;const score=precision(mean,180);s.done(score,`${round(mean)} ms avg drift`,`Target ${round(tempo)} BPM. Average timing deviation ${round(mean)} milliseconds. Positive/negative errors are treated equally.`)}};disc.onclick=press;s.on(window,'keydown',e=>{if(e.code==='Space'&&!e.repeat&&ready)press(e)});
 $('#beginbeat',s.stage).onclick=()=>{try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}$('#beginbeat',s.stage).remove();disc.disabled=true;for(let i=0;i<4;i++)s.after(()=>{tick();disc.classList.add('pulsing');$('#beatcounter',s.stage).textContent=`${'● '.repeat(i+1)}${'○ '.repeat(3-i)}`;s.after(()=>disc.classList.remove('pulsing'),120)},300+i*period);s.after(()=>{ready=true;disc.disabled=false;start=performance.now();update('Your turn. Keep the pulse going!');$('#beatcounter',s.stage).textContent='0 / 5 taps'},300+4*period)};}

function mindSwitch(s){let roundNo=0,correct=0,started=performance.now(),reactionTotal=0,answer='';const dirs=['←','→','↑','↓'],names=['LEFT','RIGHT','UP','DOWN'];
 function draw(){if(roundNo>=16){const mean=reactionTotal/16,acc=correct/16;const score=clamp(acc*100-Math.max(0,mean-900)*.018,0,100);s.done(score,`${correct} / 16`,`Accuracy ${round(acc*100)}%; average ${round(mean)} ms per decision.`);return}let index=irnd(0,3),wordIndex=(index+irnd(1,3))%4;answer=names[index];const start=performance.now();h(s.stage,`${stageStats(roundNo+1,16,'Ignore the word')}<div class="switch-tip">POINTING DIRECTION · NOT THE WORD</div><div class="switch-prompt"><span>${names[wordIndex]}</span><strong>${dirs[index]}</strong></div><div class="switch-options">${names.map((v,i)=>`<button data-dir="${v}" aria-label="${v}">${dirs[i]} <span>${v}</span></button>`).join('')}</div><div class="game-subtext">Choose the direction the arrow points.</div>`);s.stage.querySelectorAll('[data-dir]').forEach(btn=>btn.onclick=()=>{reactionTotal+=performance.now()-start;correct+=btn.dataset.dir===answer?1:0;roundNo++;draw()})}draw()}

const PAIRS=[['O','Q'],['E','F'],['C','G'],['P','R'],['5','S'],['8','B'],['6','G'],['M','N'],['7','T'],['I','L'],['9','6'],['D','O'],['◐','◑'],['↗','↖'],['⊙','⊗'],['×','+']];
function odd(s){let roundNo=0,sum=0;
 function draw(){if(roundNo>=8){s.done(sum/8,`${round(sum/8)} / 100`,'Eight visual-search grids.');return}const [same,different]=choice(PAIRS),N=36,chosen=irnd(0,N-1),start=performance.now();h(s.stage,`${stageStats(roundNo+1,8,'Visual search')}<div class="odd-title">Find the odd one out.</div><div class="odd-grid">${Array.from({length:N},(_,i)=>`<button data-i="${i}" aria-label="Symbol ${i+1}">${i===chosen?different:same}</button>`).join('')}</div><div class="game-subtext">One symbol is subtly different.</div>`);s.stage.querySelectorAll('[data-i]').forEach(btn=>btn.onclick=()=>{const t=performance.now()-start,ok=+btn.dataset.i===chosen;const score=ok?clamp(105-(t-850)*.026,0,100):0;sum+=score;const correct=s.stage.querySelector(`[data-i="${chosen}"]`);correct.classList.add('answer');if(!ok)btn.classList.add('wrong');s.stage.querySelectorAll('[data-i]').forEach(x=>x.disabled=true);roundNo++;s.after(draw,650)})}draw()}

const SHAPES=['◆','●','▲','■','★','⬢'],HUES=['#b7f978','#c3afff','#ffaf80','#82cefb'];
function pattern(s){let roundNo=0,correct=0;
 function draw(){if(roundNo>=8){s.done(correct/8*100,`${correct} / 8`,`Found ${correct} rules across eight patterns.`);return}let type=irnd(0,3),base=irnd(0,4),hue=irnd(0,3),series=[],answer='';let symbol=(j)=>SHAPES[(base+j)%SHAPES.length];if(type===0){series=Array.from({length:6},(_,i)=>symbol(i%2))}
 else if(type===1){series=Array.from({length:6},(_,i)=>symbol(i%3))}
 else if(type===2){series=Array.from({length:6},(_,i)=>SHAPES[(base+i)%SHAPES.length])}
 else{series=Array.from({length:6},(_,i)=>symbol([0,1,1,0][i%4]))}
 answer=series[5];const options=shuffle([answer,...shuffle(SHAPES.filter(x=>x!==answer)).slice(0,3)]);h(s.stage,`${stageStats(roundNo+1,8,'Pattern recognition')}<div class="pattern-title">What comes next?</div><div class="pattern-series">${series.slice(0,5).map((c,i)=>`<span style="--symbol-color:${HUES[(hue+i)%4]}">${c}</span>`).join('')}<span class="mystery">?</span></div><div class="pattern-options">${options.map((o,i)=>`<button data-i="${i}" aria-label="Option ${i+1}">${o}</button>`).join('')}</div><div class="game-subtext">One rule repeats throughout the row.</div>`);s.stage.querySelectorAll('[data-i]').forEach(btn=>btn.onclick=()=>{const ok=options[+btn.dataset.i]===answer;if(ok)correct++;s.stage.querySelectorAll('[data-i]').forEach(b=>{if(options[+b.dataset.i]===answer)b.classList.add('answer');else if(b===btn)b.classList.add('wrong');b.disabled=true});roundNo++;s.after(draw,700)})}draw()}

function mirror(s){let roundNo=0,sum=0,source={x:0,y:0},target={x:0,y:0},axis=0;const W=360,H=310;
 function draw(){axis=irnd(0,1);source={x:rnd(65,150),y:rnd(65,245)};target=axis===0?{x:W-source.x,y:source.y}:{x:source.x,y:H-source.y};const line=axis===0?`<line x1="180" x2="180" y1="0" y2="310"/>`:`<line x1="0" x2="360" y1="155" y2="155"/>`;h(s.stage,`${stageStats(roundNo+1,5,'Spatial reflection')}<div class="mirror-title">Tap the reflected dot.</div><div class="mirror-field" id="mirrorfield"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><g stroke="#77808c" stroke-width="2" stroke-dasharray="8,9">${line}</g><circle cx="${source.x}" cy="${source.y}" r="10" fill="#d9f96c"/></svg></div><div class="game-subtext">The dashed line is your mirror.</div>`);const board=$('#mirrorfield',s.stage);board.onclick=e=>{const r=board.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,error=Math.hypot(x-target.x,y-target.y),score=precision(error,38);sum+=score;board.onclick=null;const truth=el('span','mirror-dot truth');truth.style.left=target.x/W*100+'%';truth.style.top=target.y/H*100+'%';const mine=el('span','mirror-dot mine');mine.style.left=x/W*100+'%';mine.style.top=y/H*100+'%';board.append(truth,mine);roundNo++;s.after(()=>{if(roundNo>=5)s.done(sum/5,`${round(sum/5)} / 100`,'Average positional error across five reflections.');else draw()},1000)}}draw()}

const ENGINES={reaction,aim,sequence,grid,digits,words,chimp,dots,angle,split,color,balance,track,clock,beat,switch:mindSwitch,odd,pattern,mirror};
function mountGame(id,stage,finish){const session=new Session(stage,finish);try{if(!ENGINES[id])throw Error(`Unknown game: ${id}`);const cleanup=ENGINES[id](session);if(typeof cleanup==='function')session.cleanups.push(cleanup)}catch(e){stage.innerHTML=`<div class="center-note"><h2>Something went sideways.</h2><p>Restart this challenge to try again.</p></div>`;console.error(e)}return()=>session.stop()}



const STORE_KEY='tilt-playground-v1';
const app=document.querySelector('#app');
const icons={home:'⌂',library:'▦',stats:'↗',daily:'✳'};
const initial=()=>({history:[],favorites:[],daily:{},created:Date.now()});
let store;try{store={...initial(),...JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}}catch{store=initial()}
let page='home',filter='All',query='',selected=null,sessionStop=null,playMode='practice',result=null,showFavorites=false;
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch{}};
const historyFor=id=>store.history.filter(x=>x.id===id);
const bestFor=id=>historyFor(id).reduce((a,b)=>Math.max(a,b.score),0);
const dateLabel=()=>new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const recorded=()=>Object.keys(store.daily).sort().filter(d=>store.daily[d]?.length>=5);
const streak=()=>{let d=new Date();let streak=0;const days=new Set(recorded());for(let i=0;i<365;i++){const key=new Date(d).toLocaleDateString('en-CA');if(!days.has(key)){if(i===0){d.setDate(d.getDate()-1);continue}break}streak++;d.setDate(d.getDate()-1)}return streak};
const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const scores=()=>store.history.map(x=>x.score);
const avg=a=>a.length?Math.round(a.reduce((a,b)=>a+b,0)/a.length):0;
const skillColor={Reflex:'#f9a776',Memory:'#c5b3ff',Perception:'#bdf588',Timing:'#f8d080',Focus:'#8ccff2',Reasoning:'#d5adff'};
const formatDay=x=>new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric'});

function shell(content){return `<div class="shell"><aside class="sidebar"><button class="brand" data-action="home" aria-label="TILT homepage"><span class="brand-mark">T</span><span class="brand-name">tilt<span class="brand-stop">.</span></span></button><div class="side-eyebrow">YOUR PLAYGROUND</div><nav class="side-nav" aria-label="Main navigation"><button class="nav-link ${page==='home'?'active':''}" data-action="home"><span class="nav-symbol">⌂</span> Overview</button><button class="nav-link ${page==='library'?'active':''}" data-action="library"><span class="nav-symbol">▦</span> Game library <span class="nav-count">19</span></button><button class="nav-link ${page==='stats'?'active':''}" data-action="stats"><span class="nav-symbol">⌁</span> My stats</button></nav><div class="side-divider"></div><div class="side-eyebrow">YOUR CATEGORIES</div><div class="side-tags">${CATEGORIES.slice(1).map(c=>`<button class="side-category ${filter===c&&page==='library'?'active':''}" data-action="category" data-category="${c}"><span style="background:${skillColor[c]}"></span>${c}</button>`).join('')}</div><div class="sidebar-bottom"><span class="orbital-icon">✳</span><div><strong>Small games.<br>Big brain energy.</strong><p>Made for curiosity, not diagnosis.</p></div></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumbs">THE PLAYGROUND <span>/</span> <strong>${page==='game'?'GAME SESSION':page==='stats'?'MY STATS':page==='library'?'ALL GAMES':'OVERVIEW'}</strong></div><div class="top-right"><span class="today-label">${dateLabel().toUpperCase()}</span><div class="top-avatar" title="Local profile">M</div></div></header><main id="main">${content}</main><footer class="site-footer"><span>✳ TILT — PLAY WITH YOUR INSTINCTS</span><span>NO ACCOUNTS. NO ADVERTISING. JUST PLAY.</span></footer></div></div>`}
function card(g,i=0){const favorite=store.favorites.includes(g.id);const best=bestFor(g.id);return `<article class="game-card card-${g.color}" style="--delay:${Math.min(i,10)*50}ms"><button class="card-favorite ${favorite?'on':''}" data-action="favorite" data-id="${g.id}" aria-label="${favorite?'Remove from':'Add to'} favorites" title="Favorite">${favorite?'♥':'♡'}</button><button class="card-main" data-action="open" data-id="${g.id}"><div class="card-art art-${g.id}"><div class="art-halo"></div><span class="art-symbol">${g.symbol}</span><span class="art-grain">✧ ✳</span></div><div class="card-topline"><span>${g.tag}</span><span>↗</span></div><h3>${g.title}</h3><p>${g.desc}</p><div class="card-bottom"><span>${g.cat}</span><span class="tiny-dot"></span><span>~${g.duration}s</span>${best?`<span class="card-best">BEST ${best}</span>`:''}</div></button></article>`}
const pageHeading=(eyebrow,title,desc)=>`<div class="page-title"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>`;
const dailyCompleted=()=>dailyIds().filter(id=>store.daily[today()]?.some(x=>x.id===id)).length;
function home(){const total=store.history.length,daily=dailyIds(),done=dailyCompleted(),favorites=GAMES.filter(x=>store.favorites.includes(x.id));const recent=GAMES.filter(x=>historyFor(x.id).length).sort((a,b)=>historyFor(b.id).at(-1).at-historyFor(a.id).at(-1).at).slice(0,4);
 return `<div class="home"><div class="hero"><div class="hero-content"><div class="eyebrow hero-eyebrow"><span class="eyebrow-line"></span> A PLAYGROUND FOR YOUR PERCEPTION</div><h1>How good is your<br>brain at <em>being a brain?</em></h1><p>19 bite-sized games for your memory, reflexes, focus and instincts. No lectures. Just tiny moments of “one more try.”</p><div class="hero-actions"><button class="btn-accent" data-action="daily">Play today's circuit <span>↗</span></button><button class="btn-quiet" data-action="library">Browse all games <span>↗</span></button></div><div class="hero-caption"><span class="pulse-dot"></span> NO ACCOUNT NEEDED <span class="sep">·</span> PROGRESS STAYS ON THIS DEVICE</div></div><div class="hero-visual" aria-hidden="true"><div class="orb orb-outer"><div class="orb orb-inner"><div class="orb-core">✳</div></div></div><span class="orbit-label label-one">PERCEPTION ↗</span><span class="orbit-label label-two">FOCUS — 092</span><span class="orbit-label label-three">SENSE / RESPONSE</span><div class="mini-stars">✦</div></div></div>
 <div class="dashboard-strip"><div class="strip-intro"><div class="eyebrow">YOUR SNAPSHOT</div><span>Keep showing up.<br>That’s the game.</span></div><div class="strip-stat"><strong>${total}</strong><span>GAMES PLAYED</span></div><div class="strip-stat"><strong>${streak()} <small>days</small></strong><span>DAILY STREAK</span></div><div class="strip-stat"><strong>${avg(scores())||'—'}</strong><span>AVG GAME SCORE</span></div><div class="strip-action"><button data-action="stats">SEE YOUR PROGRESS <span>↗</span></button></div></div>
 <section class="section daily-section"><div class="section-top"><div><div class="eyebrow">01 / YOUR DAILY RITUAL</div><h2>Today's circuit<span class="title-spark">✳</span></h2><p>Five quick games. A fresh combination each day.</p></div><div class="daily-progress"><span>${done}<small> / 5</small></span><div class="progress-track"><div style="width:${done*20}%"></div></div><small>COMPLETED TODAY</small></div></div><div class="daily-track">${daily.map((id,i)=>{const g=byId(id),hit=store.daily[today()]?.some(x=>x.id===id);return `<button class="daily-step ${hit?'completed':''}" data-action="open-daily" data-id="${id}"><div class="step-number">${String(i+1).padStart(2,'0')}</div><span class="step-symbol tone-${g.color}">${g.symbol}</span><div><strong>${g.title}</strong><small>${g.cat}</small></div><span class="step-go">${hit?'✓':'↗'}</span></button>`}).join('')}</div><button class="daily-bottom" data-action="daily">${done===5?'Replay the circuit for practice':'Continue today’s circuit'} <span>↗</span></button></section>
 <section class="section"><div class="section-top"><div><div class="eyebrow">02 / PICK YOUR PLAY</div><h2>Good games. Great instincts.</h2><p>A few favorites from across the lab.</p></div><button class="text-link" data-action="library">EXPLORE ALL 19 <span>↗</span></button></div><div class="game-grid">${[GAMES[0],GAMES[2],GAMES[8],GAMES[16]].map(card).join('')}</div></section>
 <section class="mission"><span class="mission-symbol">✳</span><div><div class="eyebrow">THE PHILOSOPHY</div><h2>Curiosity is a skill.<br>Keep it playful.</h2></div><p>There are no fake IQ scores here. Scores are relative to a game's challenge, and records are yours alone. Discover what you're naturally good at — and what gets better with practice.</p></section></div>`}
function library(){const shown=GAMES.filter(g=>(filter==='All'||g.cat===filter)&&(!showFavorites||store.favorites.includes(g.id))&&(`${g.title} ${g.desc} ${g.cat} ${g.tag}`.toLowerCase().includes(query.toLowerCase())));
 return `<div class="library-page">${pageHeading('THE COLLECTION / 19 LITTLE CHALLENGES','Pick a feeling. Play a game.','From reflexes to visual puzzles, every game takes less than a minute or two to learn.')}<div class="library-controls"><div class="searchbox"><span>⌕</span><input id="game-search" value="${escapeHTML(query)}" placeholder="Search games or skills..." autocomplete="off" aria-label="Search games"></div><button class="filter-favorite ${showFavorites?'active':''}" data-action="favorites-only">${showFavorites?'♥':'♡'} Favorites</button></div><div class="category-chips">${CATEGORIES.map(c=>`<button data-action="category" data-category="${c}" class="chip ${filter===c?'selected':''}">${c==='All'?'✳ ':''}${c} ${c==='All'?`<span>${GAMES.length}</span>`:''}</button>`).join('')}</div><div class="result-heading"><span><strong id="result-count">${shown.length}</strong> GAMES TO DISCOVER</span><span>CLICK A CARD TO PLAY ↗</span></div><div class="game-grid" id="games-grid">${shown.map(card).join('')||'<div class="empty-state">No games match that search. Try another category.</div>'}</div></div>`}
function plot(data){if(!data.length)return `<div class="empty-chart">PLAY A FEW GAMES TO SEE YOUR SCORE TREND HERE ↗</div>`;const values=data.slice(-30).map(x=>x.score),W=720,H=190,m=16;const xy=values.map((v,i)=>[m+(i/(Math.max(values.length-1,1)))*(W-2*m),H-14-v/100*(H-28)]);let path=xy.map((p,i)=>`${i?'L':'M'} ${p.join(' ')}`).join(' ');return `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Recent game scores trend"><path d="M${m} ${H-14}H${W-m}" stroke="#363c45" fill="none" stroke-dasharray="4 6"/><path d="M${m} ${H/2}H${W-m}" stroke="#33383e" fill="none" stroke-dasharray="4 6"/><path d="${path}" stroke="#d9f96c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#d9f96c" stroke="#191c21" stroke-width="2"/>`).join('')}</svg><div class="chart-legend"><span>LAST ${values.length} ATTEMPTS</span><span>GAME SCORE / 100</span></div>`}
function stats(){let played=GAMES.filter(x=>historyFor(x.id).length).sort((a,b)=>historyFor(b.id).length-historyFor(a.id).length);let active=GAMES.filter(x=>historyFor(x.id).length),count=store.history.length;
 return `<div class="stats-page">${pageHeading('PERSONAL LABORATORY / YOUR PROGRESS','Only competing with you.','Your personal bests, favorite skills and trends — all saved right here in your browser.')}<div class="stat-grid"><div class="stat-box"><span>TOTAL GAMES</span><strong>${count}</strong><small>Every attempt counts</small></div><div class="stat-box"><span>GAMES EXPLORED</span><strong>${played.length}<small> / 19</small></strong><small>Discover the full collection</small></div><div class="stat-box"><span>PERSONAL AVERAGE</span><strong>${count?avg(scores()):'—'}</strong><small>Index out of 100</small></div><div class="stat-box"><span>DAILY STREAK</span><strong>${streak()}<small> days</small></strong><small>Five games complete the day</small></div></div><section class="stats-panel"><div class="stats-panel-head"><div><div class="eyebrow">YOUR TRAJECTORY</div><h2>The long game.</h2></div><span>RECENT ATTEMPTS</span></div>${plot(store.history)}</section><section class="stats-panel"><div class="stats-panel-head"><div><div class="eyebrow">YOUR RECORD BOOK</div><h2>Personal bests.</h2></div><span>HIGHEST GAME SCORE</span></div><div class="records">${played.map(g=>{const hs=historyFor(g.id);return `<button class="record" data-action="open" data-id="${g.id}"><span class="record-symbol tone-${g.color}">${g.symbol}</span><div><strong>${g.title}</strong><small>${hs.length} attempts · ${g.cat}</small></div><strong class="record-score">${bestFor(g.id)} <small>/ 100</small></strong><span class="record-arrow">↗</span></button>`}).join('')||`<div class="empty-state">No records yet. Your first game is waiting.<br><button class="btn-accent" data-action="library">Explore games ↗</button></div>`}</div></section><div class="reset-line">Results are stored only in this browser. <button data-action="export">Export your data ↗</button> <button data-action="reset">Reset local progress</button></div></div>`}
function gameIntro(g){const best=bestFor(g.id);return `<div class="play-page"><button class="back-link" data-action="${playMode==='daily'?'home':'library'}">← BACK TO ${playMode==='daily'?'TODAY’S CIRCUIT':'LIBRARY'}</button><div class="play-layout"><div class="play-heading"><div class="eyebrow">${g.cat.toUpperCase()} / ${g.tag}</div><h1>${g.title}<span class="play-title-star">✳</span></h1><p>${g.desc}</p><div class="game-badges"><span>◷ ABOUT ${g.duration} SEC</span><span>✳ ${g.metric.toUpperCase()}</span><span>${best?`★ BEST ${best}/100`:'★ FIRST ATTEMPT'}</span></div></div><div class="play-card"><div class="play-card-top"><span>THE BRIEF</span><span>01 — READ / 02 — PLAY / 03 — REVEAL</span></div><div class="intro-art card-${g.color}"><span>${g.symbol}</span></div><div class="instruction-content"><div class="instruction-label">THE RULES, IN ONE BREATH</div><h2>${g.how}</h2><div class="pro-tip"><span>✳</span><p>${g.tip}</p></div><button class="btn-accent start-game" data-action="start">Start challenge <span>↗</span></button><div class="instruction-footer">NO PRACTICE PENALTY · REPLAY ANYTIME</div></div></div></div></div>`}
function playScreen(g){return `<div class="play-page"><button class="back-link" data-action="${playMode==='daily'?'home':'library'}">← EXIT CHALLENGE</button><div class="session-heading"><div><span class="eyebrow">${g.cat.toUpperCase()} / LIVE TEST</span><h1>${g.title}</h1></div><button data-action="restart" class="restart-button">↻ RESTART</button></div><div class="session-container"><div class="session-bar"><span><span class="session-pulse"></span> CHALLENGE IN PROGRESS</span><span>YOUR INSTINCTS AT WORK ✳</span></div><div id="game-stage" class="game-stage"></div></div></div>`}
function resultScreen(g){const score=result.score;const note=score>=90?'RIDICULOUSLY SHARP':score>=75?'VERY NICE INSTINCTS':score>=55?'GOOD ENERGY':'ROOM TO LEVEL UP';const progress=score*3.6;const nextId=playMode==='daily'?dailyIds().find(id=>!store.daily[today()]?.some(x=>x.id===id)):null;const high=bestFor(g.id);
 return `<div class="result-page"><button class="back-link" data-action="home">← BACK TO OVERVIEW</button><div class="result-panel"><div class="eyebrow">RUN COMPLETE / ${g.cat.toUpperCase()}</div><div class="result-ring" style="--score:${progress}deg"><div><strong>${score}</strong><small>/ 100</small></div></div><div class="result-tag">✳ ${note}</div><h1>${g.title}</h1><p class="result-raw">${escapeHTML(result.raw)}</p><p class="result-detail">${escapeHTML(result.detail)}</p><div class="result-info"><span><small>THIS RUN</small><strong>${score} pts</strong></span><span><small>PERSONAL BEST</small><strong>${high} pts</strong></span><span><small>TOTAL ATTEMPTS</small><strong>${historyFor(g.id).length}</strong></span></div><div class="result-actions"><button class="btn-accent" data-action="restart">Play again <span>↗</span></button>${nextId?`<button class="btn-quiet" data-action="open-daily" data-id="${nextId}">Next daily game →</button>`:`<button class="btn-quiet" data-action="library">More games ↗</button>`}</div><small class="results-disclaimer">Scores are playful challenge indices, not population percentiles or cognitive diagnoses.</small></div></div>`}
function render(){if(sessionStop){sessionStop();sessionStop=null}window.scrollTo?.(0,0);let content;if(page==='home')content=home();else if(page==='library')content=library();else if(page==='stats')content=stats();else if(page==='game'){const g=byId(selected);content=result?resultScreen(g):gameIntro(g)}else content=home();app.innerHTML=shell(content)}
function setPage(p){page=p;result=null;render()}
function open(id,mode='practice'){if(!byId(id))return;selected=id;playMode=mode;page='game';result=null;render()}
function startGame(){if(!selected)return;const g=byId(selected);app.querySelector('#main').innerHTML=playScreen(g);const stage=app.querySelector('#game-stage');sessionStop=mountGame(selected,stage,(score,raw,detail)=>{const attempt={id:selected,score,raw,detail,at:Date.now(),daily:playMode==='daily'};store.history.push(attempt);if(store.history.length>2000)store.history.splice(0,store.history.length-2000);if(playMode==='daily'){const d=today();store.daily[d]??=[];if(!store.daily[d].some(x=>x.id===selected))store.daily[d].push({id:selected,score,at:attempt.at})}save();result={score,raw,detail};sessionStop=null;render()});}
function exportData(){const data=new Blob([JSON.stringify({app:'TILT',version:1,exportedAt:new Date().toISOString(),...store},null,2)],{type:'application/json'});const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=`tilt-progress-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;const {action,id,category}=b.dataset;
 if(action==='home'||action==='library'||action==='stats')setPage(action);
 else if(action==='daily'){const next=dailyIds().find(id=>!store.daily[today()]?.some(x=>x.id===id))||dailyIds()[0];open(next,'daily')}
 else if(action==='open')open(id);
 else if(action==='open-daily')open(id,'daily');
 else if(action==='start')startGame();
 else if(action==='restart'){result=null;startGame()}
 else if(action==='category'){filter=category;showFavorites=false;setPage('library')}
 else if(action==='favorites-only'){showFavorites=!showFavorites;setPage('library')}
 else if(action==='favorite'){const ix=store.favorites.indexOf(id);if(ix<0)store.favorites.push(id);else store.favorites.splice(ix,1);save();const old=window.scrollY;render();window.scrollTo(0,old)}
 else if(action==='export')exportData();
 else if(action==='reset'){if(confirm('Reset your TILT game history, daily streak and favorites on this device? This cannot be undone.')){store=initial();save();setPage('stats')}}
});
app.addEventListener('input',e=>{if(e.target.id!=='game-search')return;query=e.target.value;const cards=GAMES.filter(g=>(filter==='All'||g.cat===filter)&&(!showFavorites||store.favorites.includes(g.id))&&(`${g.title} ${g.desc} ${g.cat} ${g.tag}`.toLowerCase().includes(query.toLowerCase())));app.querySelector('#games-grid').innerHTML=cards.map(card).join('')||'<div class="empty-state">No games match that search.</div>';app.querySelector('#result-count').textContent=cards.length});
window.addEventListener('popstate',()=>setPage('home'));
render();

</script>
</body>
</html>
